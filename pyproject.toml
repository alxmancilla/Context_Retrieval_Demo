[project]
name = "cmm-context-assistant"
version = "0.1.0"
description = "Source-aware enterprise context assistant on LangGraph and MongoDB Atlas"
requires-python = ">=3.11"
dependencies = [
    "chainlit==2.11.1",
    "langchain-core==1.5.4",
    "langgraph==1.2.11",
    "langgraph-checkpoint-mongodb==0.4.0",
    "langsmith==0.10.17",
    "openai==2.54.0",
    "pydantic==2.13.4",
    "pymongo==4.16.0",
    "python-dotenv==1.2.2",
    "typing-inspection==0.4.3",
    "voyageai==0.5.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: uses live external or process-level infrastructure",
    "atlas_live: requires configured MongoDB Atlas access",
    "grove_live: requires configured Grove access",
    "voyage_live: requires configured Voyage AI access",
    "chainlit_live: launches a local Chainlit server",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".chainlit/translations", "evals/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true
exclude = "(^|/)([.]venv|[.]chainlit/translations|evals/results)/"
