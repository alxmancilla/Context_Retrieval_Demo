<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Context Platform solution architecture</title>
  <desc id="desc">Flow from Chainlit through LangGraph, Atlas hybrid retrieval, Voyage reranking, reconciliation, Grove generation, citations, checkpoints, and memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#116149"/></marker>
    <style>
      .bg{fill:#f7fbf8}.panel{fill:#fff;stroke:#d5e7dc;stroke-width:2}.node{fill:#e8f5ee;stroke:#116149;stroke-width:2}.store{fill:#eef7ff;stroke:#1f6feb;stroke-width:2}.external{fill:#fff7e6;stroke:#b7791f;stroke-width:2}.guard{fill:#fdecec;stroke:#b42318;stroke-width:2}.text{font-family:Arial,Helvetica,sans-serif;fill:#09251d}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.line{stroke:#116149;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="760" rx="24"/>
  <text class="text title" x="44" y="52">Context Retrieval Demo — Designed/Implemented Architecture</text>
  <rect class="panel" x="38" y="86" width="1204" height="610" rx="22"/>
  <rect class="node" x="70" y="150" width="170" height="78" rx="14"/><text class="text label" x="105" y="183">Chainlit UI</text><text class="text small" x="100" y="207">answer + side tabs</text>
  <rect class="guard" x="290" y="150" width="184" height="78" rx="14"/><text class="text label" x="322" y="181">Identity Gate</text><text class="text small" x="309" y="207">realm, user, principals</text>
  <rect class="node" x="522" y="150" width="180" height="78" rx="14"/><text class="text label" x="565" y="181">LangGraph</text><text class="text small" x="548" y="207">coordinator + state</text>
  <rect class="node" x="752" y="150" width="180" height="78" rx="14"/><text class="text label" x="797" y="181">Intent</text><text class="text small" x="782" y="207">route + rewrite</text>
  <path class="line" d="M240 189 H290"/><path class="line" d="M474 189 H522"/><path class="line" d="M702 189 H752"/>
  <rect class="node" x="560" y="300" width="220" height="96" rx="14"/><text class="text label" x="600" y="336">Context Path</text><text class="text small" x="585" y="362">recent turns + memory-v2</text><text class="text small" x="599" y="383">non-authoritative</text>
  <rect class="node" x="845" y="300" width="250" height="96" rx="14"/><text class="text label" x="895" y="336">Source Agents</text><text class="text small" x="876" y="362">GitHub, Jira, SharePoint,</text><text class="text small" x="905" y="383">Confluence, Teams</text>
  <path class="line" d="M842 228 V270 H670 V300"/><path class="line" d="M842 228 V270 H970 V300"/>
  <rect class="store" x="78" y="314" width="200" height="72" rx="14"/><text class="text label" x="126" y="344">Checkpoints</text><text class="text small" x="112" y="368">execution state + TTL</text>
  <rect class="store" x="310" y="314" width="200" height="72" rx="14"/><text class="text label" x="350" y="344">Memory Nodes</text><text class="text small" x="334" y="368">typed, valid, versioned</text>
  <path class="line" d="M612 228 V262 H178 V314"/><path class="line" d="M560 348 H510"/>
  <rect class="store" x="822" y="458" width="298" height="96" rx="14"/><text class="text label" x="878" y="493">MongoDB Atlas</text><text class="text small" x="852" y="519">hybrid search: vector + lexical</text><text class="text small" x="868" y="540">ACL filters before ranking</text>
  <path class="line" d="M970 396 V458"/><path class="line" d="M822 506 H710 V396"/>
  <rect class="external" x="530" y="508" width="188" height="80" rx="14"/><text class="text label" x="570" y="540">Voyage AI</text><text class="text small" x="564" y="564">global reranking</text>
  <rect class="node" x="300" y="508" width="190" height="80" rx="14"/><text class="text label" x="322" y="540">Reconciliation</text><text class="text small" x="325" y="564">authority + claims</text>
  <rect class="external" x="80" y="508" width="170" height="80" rx="14"/><text class="text label" x="122" y="540">Grove</text><text class="text small" x="103" y="564">grounded answer</text>
  <path class="line" d="M822 548 H718"/><path class="line" d="M530 548 H490"/><path class="line" d="M300 548 H250"/>
  <path class="line" d="M80 548 H50 V190 H70"/>
  <rect class="store" x="1015" y="602" width="190" height="58" rx="12"/><text class="text label" x="1046" y="637">/ready checks</text>
  <text class="text small" x="58" y="724">Protected governance and indexed claim assertions determine truth; model output is rebound only to retrieved citations.</text>
</svg>