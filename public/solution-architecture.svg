<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">AI Context Platform solution architecture</title>
  <desc id="desc">Flow from Chainlit through LangGraph, Atlas hybrid retrieval with comparison modes, Voyage reranking, reconciliation, deterministic conflict notes, chat-provider generation, citations, checkpoints, and memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#116149"/></marker>
    <style>
      .bg{fill:#f7fbf8}.panel{fill:#fff;stroke:#d5e7dc;stroke-width:2}.node{fill:#e8f5ee;stroke:#116149;stroke-width:2}.store{fill:#eef7ff;stroke:#1f6feb;stroke-width:2}.external{fill:#fff7e6;stroke:#b7791f;stroke-width:2}.guard{fill:#fdecec;stroke:#b42318;stroke-width:2}.text{font-family:Arial,Helvetica,sans-serif;fill:#09251d}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.line{stroke:#116149;stroke-width:2.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1280" height="800" rx="24"/>
  <text class="text title" x="44" y="52">Context Retrieval Demo — Designed/Implemented Architecture</text>
  <rect class="panel" x="38" y="86" width="1204" height="650" rx="22"/>
  <rect class="node" x="70" y="150" width="170" height="78" rx="14"/><text class="text label" x="105" y="183">Chainlit UI</text><text class="text small" x="95" y="207">answer + inspectors</text>
  <rect class="guard" x="290" y="150" width="184" height="78" rx="14"/><text class="text label" x="322" y="181">Identity Gate</text><text class="text small" x="309" y="207">realm, user, principals</text>
  <rect class="node" x="522" y="150" width="180" height="78" rx="14"/><text class="text label" x="565" y="181">LangGraph</text><text class="text small" x="548" y="207">coordinator + state</text>
  <rect class="node" x="752" y="150" width="180" height="78" rx="14"/><text class="text label" x="781" y="181">Source Routing</text><text class="text small" x="773" y="207">intent | all | explicit</text>
  <path class="line" d="M240 189 H290"/><path class="line" d="M474 189 H522"/><path class="line" d="M702 189 H752"/>
  <rect class="store" x="70" y="278" width="220" height="86" rx="14"/><text class="text label" x="103" y="310">Pipeline Inspector</text><text class="text small" x="101" y="334">active mode + counts</text><text class="text small" x="95" y="354">rerank + degradation</text>
  <path class="line" d="M155 228 V278"/>
  <rect class="node" x="560" y="300" width="220" height="96" rx="14"/><text class="text label" x="600" y="336">Context Path</text><text class="text small" x="585" y="362">recent turns + memory-v2</text><text class="text small" x="599" y="383">non-authoritative</text>
  <rect class="node" x="845" y="300" width="250" height="96" rx="14"/><text class="text label" x="895" y="336">Source Agents</text><text class="text small" x="876" y="362">GitHub, Jira, SharePoint,</text><text class="text small" x="905" y="383">Confluence, Teams</text>
  <path class="line" d="M842 228 V270 H670 V300"/><path class="line" d="M842 228 V270 H970 V300"/>
  <rect class="store" x="315" y="286" width="200" height="66" rx="14"/><text class="text label" x="363" y="314">Checkpoints</text><text class="text small" x="349" y="336">execution state + TTL</text>
  <rect class="store" x="315" y="368" width="200" height="72" rx="14"/><text class="text label" x="354" y="398">Memory Nodes</text><text class="text small" x="338" y="422">typed + governed TTL</text>
  <path class="line" d="M612 228 V262 H415 V286"/><path class="line" d="M560 348 H515"/><path class="line" d="M560 360 H515 V404"/>
  <rect class="store" x="835" y="450" width="298" height="116" rx="14"/><text class="text label" x="891" y="482">MongoDB Atlas</text><text class="text small" x="863" y="508">hybrid: vector + lexical</text><text class="text small" x="870" y="529">$rankFusion + ACL filters</text><text class="text small" x="868" y="550">voyage-4 autoEmbed</text>
  <rect class="store" x="960" y="602" width="230" height="82" rx="14"/><text class="text label" x="1008" y="632">Retrieval Mode</text><text class="text small" x="996" y="656">hybrid | vector | lexical</text><text class="text small" x="999" y="676">demo comparison switch</text>
  <path class="line" d="M970 396 V450"/><path class="line" d="M1060 566 V602"/><path class="line" d="M835 506 H710 V396"/>
  <rect class="external" x="540" y="508" width="188" height="80" rx="14"/><text class="text label" x="580" y="540">Voyage AI</text><text class="text small" x="574" y="564">rerank-3 global</text>
  <rect class="node" x="300" y="508" width="190" height="96" rx="14"/><text class="text label" x="322" y="540">Reconciliation</text><text class="text small" x="326" y="564">authority + claims</text><text class="text small" x="328" y="584">conflict winners</text>
  <rect class="node" x="296" y="638" width="210" height="70" rx="14"/><text class="text label" x="337" y="667">Conflict Notes</text><text class="text small" x="323" y="690">readable eval terms</text>
  <rect class="external" x="80" y="520" width="170" height="80" rx="14"/><text class="text label" x="104" y="552">Chat Provider</text><text class="text small" x="95" y="576">Grove or OpenAI</text>
  <path class="line" d="M835 548 H728"/><path class="line" d="M540 548 H490"/><path class="line" d="M395 604 V638"/><path class="line" d="M300 556 H250"/>
  <path class="line" d="M80 560 H50 V190 H70"/>
  <rect class="store" x="70" y="638" width="190" height="58" rx="12"/><text class="text label" x="101" y="673">/ready checks</text>
  <text class="text small" x="58" y="764">Protected governance and indexed claim assertions determine truth; conflict notes expose evaluated terms; model output is rebound only to retrieved citations.</text>
</svg>
